# /etc/systemd/journald.conf.d/oralhistarchiv.conf
#
# Logging retention for the Oral History Archive.
# Apply with:
#   sudo cp journald-oralhistarchiv.conf /etc/systemd/journald.conf.d/oralhistarchiv.conf
#   sudo systemctl restart systemd-journald

[Journal]
# Cap total journal disk usage. Adjust based on /var/log volume size.
SystemMaxUse=2G

# Per-file cap forces rotation more frequently than the 128M default.
SystemMaxFileSize=128M

# Time-based retention. Aligned with the previous file-based log retention
# of 30 days for application logs. Audit logs previously kept for 365 days
# share this retention now — see Deployment.md section 12 for long-term
# retention options.
MaxRetentionSec=30day