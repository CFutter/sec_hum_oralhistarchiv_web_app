services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces:cached
    depends_on:
      - db


  # Development credentials; the named volume persists data across container rebuilds.
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oralhistarchiv
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No host port: connect from app to db:5432.

volumes:
  postgres-data: