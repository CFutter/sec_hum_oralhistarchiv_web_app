name: Dependency advisories

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-advisories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-advisories:
    name: recurring dependency inventory and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.12.11"
          python-version: "3.11"
      - name: Install locked scanner dependencies without building the application
        run: uv sync --locked --extra dev --no-install-project
      - name: Audit runtime, development, documentation and actual build dependencies
        run: .venv/bin/python scripts/audit_dependencies.py --output-dir dependency-advisories
      - name: Retain dated dependency evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-advisories-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dependency-advisories/*.json
            dependency-advisories/*.txt
            dependency-advisories/*.log
          if-no-files-found: error
          retention-days: 30
