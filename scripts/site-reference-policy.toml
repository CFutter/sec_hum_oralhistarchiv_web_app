# Publication policy v1. Exceptions are exact path/rule/line digest/count records.
version = 1

[[rules]]
id = "institution"
pattern = '(?i:(?<![a-z0-9])uzh(?![a-z0-9])|university\s+of\s+zurich|universität\s+zürich|\bleomed\b|\beduid\b)'
reason = "Remove deployment-specific institutional names and domains."

[[rules]]
id = "former-site"
pattern = '(?i:\bkassel\b)'
reason = "Remove former staging-site assumptions from generic examples."

[[rules]]
id = "organisation"
pattern = '\bSWITCH(?:aai)?\b|(?i:\bswitch(?:aai)?\.ch\b|\bswitch\s+edu.?id\b)'
reason = "Identify named federation organisation references, while ordinary English verbs remain allowed."

[[rules]]
id = "upstream-name"
pattern = '(?i:swissubase)'
reason = "Review vendor namespaces and retired configuration identifiers individually."

[[rules]]
id = "obsolete-proxy"
pattern = '(?i:\bcaddy\b)'
reason = "Remove the old site-specific proxy assumption; preserve exact security wordlist data."

[[rules]]
id = "site-operations"
pattern = '(?i:\bcentral\s+it\b)'
reason = "Describe operator responsibilities without assuming an institutional unit."

[[rules]]
id = "private-repository"
pattern = '(?i:github(?:usercontent)?\.com/CFutter(?:/|\b)|sec_hum_oralhistarchiv_web_app)'
reason = "Keep the current private repository identity out of generic publication material."

