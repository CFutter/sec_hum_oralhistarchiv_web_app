# /etc/systemd/journald.conf.d/oralhistarchiv.conf
#
# Host-wide journald retention; these limits are not scoped to application units.
# Apply with:
#   sudo cp journald-oralhistarchiv.conf /etc/systemd/journald.conf.d/oralhistarchiv.conf
#   sudo systemctl restart systemd-journald

[Journal]
# Cap total journal disk usage. Adjust based on /var/log volume size.
SystemMaxUse=2G

# Per-journal-file size cap.
SystemMaxFileSize=128M

# Upper age limit, not guaranteed minimum retention: disk limits can remove
# older records sooner. Longer audit retention needs sufficient space/off-host storage.
MaxRetentionSec=30day