[project]
name = "Oral-History-Archive"
version ="0.1.0"
requires-python = ">=3.11"


dependencies = [
    "APScheduler==3.11.2",
    "alembic==1.18.5",
    "email-validator==2.3.0",
    "fastapi==0.136.3",
    "uvicorn==0.40.0",
    "uvicorn-worker==0.4.0",
    "jinja2==3.1.6",
    "psycopg[binary,pool]==3.3.2",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "secure==1.0.1",
    "slowapi==0.1.9",
    "requests==2.33.0",
    "lxml==6.1.1",
    "itsdangerous==2.2.0",
    "pyotp==2.9.0",
    "python-multipart==0.0.32",
    "argon2-cffi==25.1.0",
    "cryptography==49.0.0",
    "qrcode[pil]==8.0",
    "gunicorn==23.0.0",
    "redis==7.4.0",
    "SQLAlchemy==2.0.50"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "ruff==0.15.6",
    "bandit==1.9.2",
    "pip-audit==2.9.0",
    "mypy==2.1.0",
    "types-gunicorn==26.0.0.20260518",
    "types-requests==2.32.4.20250611", 
    "lxml-stubs==0.5.1",
    "types-qrcode==8.2.0.20260518"
]

doc = [
    "mkdocs-material==9.7.6",
    "mkdocstrings-python==2.0.3",
    "mkdocs-mermaid2-plugin==1.2.3"
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that require a real PostgreSQL database (Tier 2)",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:Redis is disabled in production:RuntimeWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/config"]
