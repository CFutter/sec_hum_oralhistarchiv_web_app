site_name: Oral History Archive Documentation
site_description: Developer, operator, and user documentation for the Digital Oral History Archive
hooks:
  - scripts/mkdocs_hooks.py
watch:
  - Deployment.md
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Status: project-status.md
  - User Guide:
      - Overview: user-guide/overview.md
      - Browsing & Searching: user-guide/browsing.md
      - Accounts & Access Tiers: user-guide/accounts.md
  - Sources:
      - Overview: sources/index.md
      - Feed Contract v1: sources/feed-contract-v1.md
      - JSON-feed configuration: sources/json-feed-configuration.md
      - JSON-feed transport: sources/json-feed-transport.md
      - JSON-feed pages: sources/json-feed-pages.md
      - JSON-feed records: sources/json-feed-records.md
      - JSON-feed adapter: sources/json-feed-adapter.md
      - JSON-feed persistence: sources/json-feed-persistence.md
      - JSON-feed acceptance: sources/json-feed-acceptance.md
      - OAI Ingestion Limits: sources/oai-ingestion-limits.md
      - Sensitive Source Contract: architecture/source-b-ingestion-contract.md
  - Architecture:
      - Overview: architecture/overview.md
      - Request Lifecycle: architecture/request-lifecycle.md
      - Data Model: architecture/data-model.md
      - Authentication & Sessions: architecture/auth.md
      - Federated Tier Proposals: architecture/federated-tier-rules.md
      - Access Control & Visibility: architecture/access-control.md
      - Field Visibility: architecture/field-visibility.md
      - Resource Access & Audit: architecture/resource-access.md
      - Source Ingestion Pipeline: architecture/sync.md
      - Security Layers: architecture/security.md
  - Configuration & Operations:
      - Settings Reference: configuration/settings.md
      - Deployment: configuration/deployment.md
      - Deployment Runbook: Deployment.md
      - Laptop Staging: runbooks/local-staging.md
      - Retained Staging Inventory: runbooks/retained-staging-inventory.md
      - Retained Staging Record Template: runbooks/retained-staging-record-template.md
      - External Dependencies & Decisions: runbooks/external-dependencies-and-decisions.md
      - External Dependency Record Template: runbooks/external-dependencies-record-template.md
      - Before-staging & PoC Handoff: runbooks/before-staging-handoff.md
      - Staging Candidate Record Template: runbooks/staging-candidate-record-template.md
      - Logging & Audit: configuration/logging.md
      - Runbook — Key Rotation: runbooks/key-rotation.md
      - Runbook — Search Policy: runbooks/search-policy.md
      - Runbook — Initial Administrator: runbooks/bootstrap-admin.md
      - Runbook — Mail and Account Recovery: runbooks/mail-recovery.md
      - Runbook — Security Event Delivery: runbooks/security-event-delivery.md
      - Runbook — Deployment Boundaries: runbooks/deployment-boundaries.md
      - Runbook — Dependency Advisories: runbooks/dependency-advisories.md
      - Runbook — Source Rebinding: runbooks/source-rebinding.md
      - Runbook — Visibility & Recovery Acceptance: runbooks/visibility-recovery-acceptance.md
      - Runbook — Federated Tier Acceptance: runbooks/federated-tier-acceptance.md
      - Runbook — Federation Integration: runbooks/federation-integration.md
      - Runbook — Account Deletion: runbooks/account-deletion.md
      - Runbook — Action Links: runbooks/action-links.md
      - Runbook — Monitoring: runbooks/monitoring.md
      - Runbook — Point-in-Time Recovery: runbooks/point-in-time-recovery.md
  - Compliance:
      - Processing Register & Asset Inventory: compliance/processing-register.md
      - DPIA Questionnaire: compliance/dpia-questionnaire.md
      - DSAR Procedure: compliance/dsar-procedure.md
      - Incident Response: compliance/incident-response.md
      - Data Classification: compliance/data-classification.md
      - Retention & DSAR Supplement: runbooks/retention-dsar-template.md
  - Code Reference:
      - Application Entry: reference/main.md
      - Route Security Contract: reference/route-security.md
      - Routes:
          - Pages: reference/routes/pages.md
          - Auth: reference/routes/auth.md
          - Health: reference/routes/health.md
      - Services:
          - Datasets: reference/services/datasets.md
          - Users: reference/services/users.md
          - Sessions: reference/services/sessions.md
          - Sync & OAI: reference/services/sync.md
          - Database & Schema: reference/services/db.md
          - Crypto & Passwords: reference/services/crypto.md
          - Email, Cache & Scheduler: reference/services/misc.md
      - Middleware: reference/middleware.md
      - Configuration Module: reference/config.md
  - HTML Templates: templates.md

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_type_to_nopackage: true
            signature_crossrefs: true
            members_order: source
            docstring_style: google
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
